<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Smart Home Timer</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

h1{
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:20px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:15px;
    font-size:18px;
    color:white;
    cursor:pointer;
}

.on{
    background:#22c55e;
}

.off{
    background:#ef4444;
}

.timer{
    background:#3b82f6;
}

.status{
    margin-top:15px;
    font-size:18px;
}

</style>
</head>

<body>

<h1>🏠 Smart Home Control</h1>

<div class="container">

<!-- PLUG 1 -->
<div class="card">

<h2>🔌 Plug 1</h2>

<button class="on"
onclick="sendMQTT('room/fan1','ON',1)">
ON
</button>

<button class="off"
onclick="sendMQTT('room/fan1','OFF',1)">
OFF
</button>

<button class="timer"
onclick="sendMQTT('room/fan1','TIMER_30',1)">
⏰ 30 MIN
</button>

<button class="timer"
onclick="sendMQTT('room/fan1','TIMER_60',1)">
⏰ 1 HOUR
</button>

<div class="status" id="s1">
READY
</div>

</div>

<!-- PLUG 2 -->
<div class="card">

<h2>🔌 Plug 2</h2>

<button class="on"
onclick="sendMQTT('room/fan2','ON',2)">
ON
</button>

<button class="off"
onclick="sendMQTT('room/fan2','OFF',2)">
OFF
</button>

<button class="timer"
onclick="sendMQTT('room/fan2','TIMER_30',2)">
⏰ 30 MIN
</button>

<button class="timer"
onclick="sendMQTT('room/fan2','TIMER_60',2)">
⏰ 1 HOUR
</button>

<div class="status" id="s2">
READY
</div>

</div>

<!-- PLUG 3 -->
<div class="card">

<h2>🔌 Plug 3</h2>

<button class="on"
onclick="sendMQTT('room/fan3','ON',3)">
ON
</button>

<button class="off"
onclick="sendMQTT('room/fan3','OFF',3)">
OFF
</button>

<button class="timer"
onclick="sendMQTT('room/fan3','TIMER_30',3)">
⏰ 30 MIN
</button>

<button class="timer"
onclick="sendMQTT('room/fan3','TIMER_60',3)">
⏰ 1 HOUR
</button>

<div class="status" id="s3">
READY
</div>

</div>

<!-- PLUG 4 -->
<div class="card">

<h2>🔌 Plug 4</h2>

<button class="on"
onclick="sendMQTT('room/fan4','ON',4)">
ON
</button>

<button class="off"
onclick="sendMQTT('room/fan4','OFF',4)">
OFF
</button>

<button class="timer"
onclick="sendMQTT('room/fan4','TIMER_30',4)">
⏰ 30 MIN
</button>

<button class="timer"
onclick="sendMQTT('room/fan4','TIMER_60',4)">
⏰ 1 HOUR
</button>

<div class="status" id="s4">
READY
</div>

</div>

</div>

<script>

// ================= MQTT =================

const broker =
'wss://broker.hivemq.com:8884/mqtt';

const client = mqtt.connect(broker);

client.on('connect', ()=>{

    console.log("MQTT Connected");
});

// ================= SEND MQTT =================

function sendMQTT(topic,message,id){

    client.publish(topic,message);

    console.log(topic + ":" + message);

    document.getElementById("s"+id)
    .innerHTML = message;
}

</script>

</body>
</html>
